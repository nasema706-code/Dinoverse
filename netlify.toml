[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  BETTER_AUTH_URL = "https://the-dinoverse.netlify.app"

[[headers]]
  for = "/intro.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=3600"
